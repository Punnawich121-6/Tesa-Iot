<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireBot · Robot + Map</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0d1117; --line:#30363d; --line2:#21262d; --dim:#8b949e;
    --red:#f85149; --grn:#3fb950; --amb:#d29922; --cyn:#39c5cf;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg); color:#e6edf3;
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

  #view{position:fixed;inset:0}
  #view canvas{display:block}

  /* แผนที่ occupancy grid — จอเดียวที่เหลืออยู่นอกจากตัวหุ่น */
  #map-lbl{
    position:fixed; left:16px; bottom:214px; font-size:10.5px; color:var(--dim);
    background:rgba(1,4,9,.8); padding:3px 8px; border-radius:5px; pointer-events:none;
  }
  #minimap{
    position:fixed; left:16px; bottom:16px; border:1px solid var(--line2);
    border-radius:9px; background:#010409;
  }

  /* สถานะการเชื่อมต่อ — ไม่ใช่ปุ่มควบคุม แค่บอกว่าลิงก์ยังดีอยู่ */
  #chip{
    position:fixed; right:16px; top:16px; padding:9px 13px; border-radius:9px;
    background:rgba(13,17,23,.9); border:1px solid var(--line); white-space:pre;
    font:600 11px/1.6 ui-monospace,Menlo,monospace; color:var(--dim);
    backdrop-filter:blur(6px); pointer-events:none;
  }
  #chip.ok{border-color:#238636;color:var(--grn)}
  #chip.bad{border-color:var(--red);color:var(--red)}

  #loader{
    position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:13px;
    background:var(--bg);z-index:20;transition:opacity .4s;
  }
  #loader.done{opacity:0;pointer-events:none}
  #lbar{width:230px;height:3px;background:var(--line2);border-radius:2px;overflow:hidden}
  #lbar>i{display:block;height:100%;width:0;background:var(--red);transition:width .15s}
  #lpct{font-size:12px;color:var(--dim)}
  #lerr{color:var(--red);max-width:440px;text-align:center;font-size:12.5px}
</style>
</head>
<body>

<div id="view"></div>

<div id="map-lbl" class="mono">แผนที่จาก LiDAR · 100 mm/ช่อง</div>
<canvas id="minimap" width="248" height="204"></canvas>

<div id="chip" class="mono">เริ่มระบบ…</div>

<div id="loader">
  <div id="lbar"><i></i></div>
  <div id="lpct">กำลังโหลดโมเดล…</div>
  <div id="lerr"></div>
</div>

<!-- mqtt.js vendored ในเครื่อง (ไม่พึ่ง CDN) — สร้าง global `mqtt` -->
<script src="vendor/mqtt.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader }     from 'three/addons/loaders/STLLoader.js';

/* =========================================================================
   ค่าที่วัดจาก Firefighter-robot.stl โดยตรง (หน่วยในไฟล์ = mm)
   ========================================================================= */
const WHEEL_R_MM   = 45.15;
const WHEEL_SEP_MM = 333.5;
const AXLE         = { x:166.75, y:17.15, z:2.15 };
const GROUND_Y     = -28.05;

const R = WHEEL_R_MM/1000;                     // 0.04515 m
const L = WHEEL_SEP_MM/1000;                   // 0.3335  m

const MAX_V = 1.2, MAX_W = 2.6;                // m/s, rad/s
const ACC_V = 1.6, ACC_W = 5.0;
const V_BATT = 24, BATT_WH = 240;

/* =========================================================================
   MQTT — หน้านี้เป็นตัวหุ่น: รับคำสั่ง แล้วส่งค่าที่วัดได้ออกไป
   ควบคุมได้จาก Pancabo Fire Control เท่านั้น (หน้านี้ไม่มีปุ่ม/คีย์บอร์ด)
   ========================================================================= */
const BROKER     = 'ws://127.0.0.1:8883/mqtt';
const T_TELEM    = 'sensor-studio/connectivity/telemetry';   // ค่าเริ่มต้นของโหนด MQTT Subscriber
const T_DRIVE    = 'firebot/tesa-demo/robot/R1/drive';
const T_SCAN     = 'firebot/tesa-demo/robot/R1/scan';
const T_MAP      = 'firebot/tesa-demo/robot/R1/map';
const T_CMD      = 'firebot/tesa-demo/robot/R1/cmd';

const HZ_TELEM = 20, HZ_SCAN_PER_REV = true, HZ_MAP = 1;

let client = null, pubN = 0, cmdN = 0, lastCmdTs = 0;

// คำสั่งจากตัวควบคุม — ค่าเริ่มต้นคือหยุดนิ่ง
const CMD = { v:0, w:0, throttle:0.55, spray:false, auto:false, estop:false };

function mqttStart(){
  if(typeof mqtt === 'undefined'){ paintChip('ไม่พบ mqtt.js','bad'); return; }
  client = mqtt.connect(BROKER, {
    clientId:'firebot-robot-'+Math.random().toString(16).slice(2,8),
    reconnectPeriod:3000, connectTimeout:5000, clean:true,
  });
  client.on('connect', ()=>{ client.subscribe(T_CMD,{qos:0}); });
  client.on('message', (topic, buf)=>{
    if(topic !== T_CMD) return;
    let p; try{ p = JSON.parse(buf.toString()); }catch(e){ return; }
    cmdN++; lastCmdTs = Date.now();
    if(p.reset){ resetAll(); return; }
    if(typeof p.v        === 'number')  CMD.v = Math.max(-1, Math.min(1, p.v));
    if(typeof p.w        === 'number')  CMD.w = Math.max(-1, Math.min(1, p.w));
    if(typeof p.throttle === 'number')  CMD.throttle = Math.max(0.05, Math.min(1, p.throttle));
    if(typeof p.spray    === 'boolean') CMD.spray = p.spray;
    if(typeof p.auto     === 'boolean') CMD.auto  = p.auto;
    if(typeof p.estop    === 'boolean') CMD.estop = p.estop;
    if(CMD.estop){ CMD.v = 0; CMD.w = 0; CMD.spray = false; CMD.auto = false; }
  });
}

/* =========================================================================
   ฉาก
   ========================================================================= */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 4000, 13000);

const camera = new THREE.PerspectiveCamera(45, 1, 5, 40000);
camera.position.set(1100, 900, 1500);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 120, 0);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1f26, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(700, 1200, 600);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-1200,right:1200,top:1200,bottom:-1200,near:1,far:5000});
key.shadow.camera.updateProjectionMatrix();
scene.add(key);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(24000,24000),
  new THREE.MeshStandardMaterial({color:0x13181f, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
scene.add(new THREE.GridHelper(24000, 120, 0x21262d, 0x191f27));

// เส้นทาง: จริง (เขียว) vs odom จาก encoder (เหลือง)
function trail(color){
  const MAX = 24000;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX*3),3));
  g.setDrawRange(0,0);
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({color}));
  line.frustumCulled = false;
  scene.add(line);
  return { g, n:0, MAX,
    push(x,z){
      if(this.n>=this.MAX) return;
      const a=this.g.attributes.position;
      a.setXYZ(this.n, x, 6, z); this.n++;
      a.needsUpdate = true; this.g.setDrawRange(0,this.n);
    },
    clear(){ this.n=0; this.g.setDrawRange(0,0); }
  };
}
const trailTrue = trail(0x3fb950), trailOdom = trail(0xd29922);

/* =========================================================================
   ฉากอาคาร — ต้องมีของให้ LiDAR ยิงชน (กล่องแนวแกนทั้งหมด ตรวจการชนง่าย)
   ========================================================================= */
const obstacles = [];
const matWall   = new THREE.MeshStandardMaterial({color:0x39424e, roughness:.9});
const matDebris = new THREE.MeshStandardMaterial({color:0x4a3b32, roughness:1});

function addBox(w,h,d,x,z,mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, h/2, z);
  m.castShadow = m.receiveShadow = true;
  m.userData.aabb = { minX:x-w/2, maxX:x+w/2, minZ:z-d/2, maxZ:z+d/2 };
  scene.add(m); obstacles.push(m);
}

const WALL_H = 1200, T = 200;
[ [10000,T, 0, 4000], [3600,T,-3200,-4000], [3600,T, 3200,-4000],
  [T,8000,-5000, 0],  [T,8000, 5000, 0],
  [T,3400, 1500, 2200], [3200,T,-3200, 1400], [T,2400,-1300,-2600],
  [2600,T, 3600,-1000], [T,2000, 2400,-2800],
].forEach(([w,d,x,z]) => addBox(w, WALL_H, d, x, z, matWall));

[[600,600,-2000,3000],[900,500,3600,2600],[500,500,-3800,-1500],
 [700,700,800,-2200],[450,450,-600,600],[800,400,4200,3400]]
  .forEach(([w,d,x,z]) => addBox(w, 520, d, x, z, matDebris));

/* =========================================================================
   LiDAR — เลียนแบบ RPLIDAR A1
   ========================================================================= */
const LIDAR = {
  on:true, h:235, rpm:300, N:360, rMin:150, rMax:12000,
  ang:0, acc:0, rev:0,
  dist:new Float32Array(360), qual:new Uint8Array(360),
  px:new Float32Array(360),  pz:new Float32Array(360),
  valid:0, stat:{valid:0,min:0,minA:-1,max:0},
};

const cloudGeo = new THREE.BufferGeometry();
cloudGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(360*3),3));
cloudGeo.setDrawRange(0,0);
const cloud = new THREE.Points(cloudGeo,
  new THREE.PointsMaterial({color:0x39c5cf, size:38, sizeAttenuation:true}));
cloud.frustumCulled = false;
scene.add(cloud);

const ray = new THREE.Raycaster();
ray.near = LIDAR.rMin;
ray.far  = LIDAR.rMax;

// ระยะที่ใกล้สุดในช่วงมุม (องศา, 0 = ตรงหน้า, + = ซ้าย) — ใช้โดยระบบขับอัตโนมัติ
function minRange(a0, a1){
  let best = LIDAR.rMax;
  for(let a=a0; a<=a1; a++){
    const d = LIDAR.dist[((a%360)+360)%360];
    if(d > 0 && d < best) best = d;
  }
  return best;
}

function lidarStep(dt){
  if(!LIDAR.on) return;
  LIDAR.acc += LIDAR.rpm/60*360*dt;
  let n = Math.floor(LIDAR.acc);
  if(n <= 0) return;
  LIDAR.acc -= n;
  n = Math.min(n, 720);

  const ox = S.true_.x*1000, oz = S.true_.z*1000;
  const org = new THREE.Vector3(ox, LIDAR.h, oz);
  const dir = new THREE.Vector3();

  for(let i=0;i<n;i++){
    LIDAR.ang += 1;
    if(LIDAR.ang >= 360){ LIDAR.ang -= 360; LIDAR.rev++; onRevComplete(); }
    const k  = LIDAR.ang % 360;
    const wa = S.true_.th + k*Math.PI/180;
    dir.set(Math.sin(wa), 0, Math.cos(wa));
    ray.set(org, dir);
    const hit = ray.intersectObjects(obstacles, false)[0];
    if(hit){
      const d = hit.distance * (1 + (Math.random()*2-1)*0.008);   // noise ±0.8%
      LIDAR.dist[k] = d;
      LIDAR.qual[k] = Math.max(1, Math.min(63,
        Math.round(60*(1 - d/LIDAR.rMax) + (Math.random()*6-3))));
      LIDAR.px[k] = ox + Math.sin(wa)*d;
      LIDAR.pz[k] = oz + Math.cos(wa)*d;
      gridRay(ox, oz, LIDAR.px[k], LIDAR.pz[k], true);
    }else{
      LIDAR.dist[k] = 0;                     // RPLIDAR: 0 = วัดไม่ได้
      LIDAR.qual[k] = 0;
      gridRay(ox, oz, ox+Math.sin(wa)*LIDAR.rMax, oz+Math.cos(wa)*LIDAR.rMax, false);
    }
  }

  const pos = cloudGeo.attributes.position;
  let m = 0;
  for(let k=0;k<360;k++){
    if(LIDAR.dist[k] <= 0) continue;
    pos.setXYZ(m++, LIDAR.px[k], LIDAR.h, LIDAR.pz[k]);
  }
  pos.needsUpdate = true; cloudGeo.setDrawRange(0,m); LIDAR.valid = m;
}

function onRevComplete(){
  let valid=0, min=Infinity, minA=-1, max=0;
  for(let k=0;k<360;k++){
    const d = LIDAR.dist[k];
    if(d<=0) continue;
    valid++;
    if(d<min){ min=d; minA=k; }
    if(d>max) max=d;
  }
  LIDAR.stat = { valid, min: valid?min:0, minA, max };
  if(HZ_SCAN_PER_REV) pubScan();
}

/* =========================================================================
   Occupancy grid — สร้างแผนที่จากลำแสง LiDAR
   ========================================================================= */
const GRID = { res:100, w:112, h:92, ox:-5600, oz:-4600, seen:0, data:null };
GRID.data = new Int8Array(GRID.w*GRID.h);       // -1 ว่าง · 0 ไม่รู้ · +1 มีของ

const gAt = (gx,gy)=> (gx<0||gy<0||gx>=GRID.w||gy>=GRID.h) ? null : gy*GRID.w+gx;
const toG = (mm,o)=> Math.floor((mm-o)/GRID.res);

function gridRay(x0,z0,x1,z1,hitEnd){
  let gx = toG(x0,GRID.ox), gy = toG(z0,GRID.oz);
  const ex = toG(x1,GRID.ox), ey = toG(z1,GRID.oz);
  const dx = Math.abs(ex-gx), dy = Math.abs(ey-gy);
  const sx = gx<ex?1:-1, sy = gy<ey?1:-1;
  let err = dx-dy, guard = 0;
  while(guard++ < 400){
    if(gx===ex && gy===ey) break;
    const i = gAt(gx,gy);
    if(i!==null && GRID.data[i]===0){ GRID.data[i] = -1; GRID.seen++; }
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; gx += sx; }
    if(e2 <  dx){ err += dx; gy += sy; }
  }
  if(hitEnd){
    const i = gAt(ex,ey);
    if(i!==null){
      if(GRID.data[i]===0) GRID.seen++;
      GRID.data[i] = 1;
    }
  }
}

// เข้ารหัสแผนที่เป็น base64 เพื่อส่งขึ้น MQTT (0 ไม่รู้ · 1 ว่าง · 2 มีของ)
function gridB64(){
  const u = new Uint8Array(GRID.w*GRID.h);
  for(let i=0;i<u.length;i++){ const v = GRID.data[i]; u[i] = v===1 ? 2 : v===-1 ? 1 : 0; }
  let s = ''; const CH = 8192;
  for(let i=0;i<u.length;i+=CH) s += String.fromCharCode.apply(null, u.subarray(i, i+CH));
  return btoa(s);
}

const mmap = document.getElementById('minimap');
const mctx = mmap.getContext('2d');
function drawMap(){
  const cw = mmap.width/GRID.w, ch = mmap.height/GRID.h;
  mctx.fillStyle = '#010409'; mctx.fillRect(0,0,mmap.width,mmap.height);
  for(let gy=0;gy<GRID.h;gy++) for(let gx=0;gx<GRID.w;gx++){
    const v = GRID.data[gy*GRID.w+gx];
    if(!v) continue;
    mctx.fillStyle = v===1 ? '#8b949e' : '#161f2b';
    mctx.fillRect(gx*cw, gy*ch, Math.ceil(cw), Math.ceil(ch));
  }
  for(const f of FIRES){
    if(f.int<=0.02) continue;
    mctx.fillStyle = '#f85149';
    mctx.beginPath();
    mctx.arc((toG(f.x,GRID.ox)+.5)*cw, (toG(f.z,GRID.oz)+.5)*ch, 3+f.int*3, 0, Math.PI*2);
    mctx.fill();
  }
  const rx = (toG(S.true_.x*1000,GRID.ox)+.5)*cw, ry = (toG(S.true_.z*1000,GRID.oz)+.5)*ch;
  mctx.strokeStyle = '#3fb950'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.moveTo(rx,ry);
  mctx.lineTo(rx + Math.sin(S.true_.th)*10, ry + Math.cos(S.true_.th)*10); mctx.stroke();
  mctx.fillStyle = '#3fb950';
  mctx.beginPath(); mctx.arc(rx,ry,2.8,0,Math.PI*2); mctx.fill();
}

/* =========================================================================
   ไฟไหม้ + เซนเซอร์ตรวจเพลิง
   ========================================================================= */
const FIRES = [];
function addFire(x,z,int){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(170,16,12),
    new THREE.MeshStandardMaterial({color:0xff6a3d, emissive:0xff3b12, emissiveIntensity:2.2, roughness:1})
  );
  mesh.position.set(x, 190, z);
  const light = new THREE.PointLight(0xff5722, 6, 5200, 2);
  light.position.set(x, 420, z);
  scene.add(mesh, light);
  FIRES.push({x, z, int, int0:int, mesh, light, phase:FIRES.length*1.7, los:false});
}
addFire(-3300, 2600, 1.0);
addFire( 3400,-2400, 0.85);
addFire(  900, 3100, 0.7);

const FIRE = { flame:0, tempC:32, smokePpm:0, nearest:0, nearestAng:0, out:0, losT:0 };

function fireStep(dt){
  const rx = S.true_.x*1000, rz = S.true_.z*1000;
  let flame=0, heat=0, smoke=0, near=Infinity, nearAng=0;

  FIRE.losT += dt;
  const doLos = FIRE.losT > 0.2;               // raycast แพง ทำ 5 Hz พอ
  if(doLos) FIRE.losT = 0;

  for(const f of FIRES){
    f.phase += dt*(2.4 + f.int);
    const flick = 0.78 + 0.22*Math.sin(f.phase*3.1) + 0.08*Math.sin(f.phase*7.7);
    f.mesh.visible = f.light.visible = f.int > 0.02;
    f.mesh.scale.setScalar(Math.max(0.05, f.int) * flick);
    f.light.intensity = 6 * f.int * flick;
    f.mesh.material.emissiveIntensity = 2.2 * flick;
    if(f.int <= 0.02) continue;

    const dx = f.x-rx, dz = f.z-rz, d = Math.max(200, Math.hypot(dx,dz));
    if(doLos){
      ray.near = 1;
      ray.set(new THREE.Vector3(rx,300,rz), new THREE.Vector3(dx/d,0,dz/d));
      ray.far = d - 180;
      f.los = ray.intersectObjects(obstacles, false).length === 0;
      ray.near = LIDAR.rMin; ray.far = LIDAR.rMax;
    }
    // เปลวไฟเป็น IR ทะลุกำแพงไม่ได้ · ความร้อน/ควันลอดได้บางส่วน
    if(f.los) flame += f.int * Math.min(1, (1500/d)**2);
    heat  += f.int * 60000/d  * (f.los ? 1 : 0.35);
    smoke += f.int * 300000/d * (f.los ? 1 : 0.6);
    if(d < near){
      near = d;
      let a = Math.atan2(dx,dz) - S.true_.th;
      while(a >  Math.PI) a -= 2*Math.PI;
      while(a < -Math.PI) a += 2*Math.PI;
      nearAng = a*180/Math.PI;
    }
  }
  FIRE.flame    += (Math.min(1,flame) - FIRE.flame) * Math.min(1, dt*8);
  FIRE.tempC    += ((32+heat) - FIRE.tempC) * Math.min(1, dt*1.2);
  FIRE.smokePpm += (Math.min(5000,smoke) - FIRE.smokePpm) * Math.min(1, dt*1.5);
  FIRE.nearest    = near===Infinity ? 0 : near;
  FIRE.nearestAng = near===Infinity ? 0 : nearAng;
  FIRE.out = FIRES.filter(f=>f.int<=0.02).length;
}

/* =========================================================================
   หัวฉีดน้ำ
   ========================================================================= */
const WATER = { on:false, tank:100, lpm:38, used:0, N:420 };
const wGeo = new THREE.BufferGeometry();
wGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(WATER.N*3),3));
const wVel  = new Float32Array(WATER.N*3);
const wLife = new Float32Array(WATER.N);
const wPts = new THREE.Points(wGeo,
  new THREE.PointsMaterial({color:0x7fd4ff, size:26, transparent:true, opacity:.85, sizeAttenuation:true}));
wPts.frustumCulled = false;
scene.add(wPts);

function waterStep(dt){
  WATER.on = (CMD.auto ? AUTO.spray : CMD.spray) && !CMD.estop;
  const spraying = WATER.on && WATER.tank > 0;
  if(spraying){
    WATER.tank = Math.max(0, WATER.tank - WATER.lpm/60*dt/2.2);   // ถัง 2.2 ลิตร ≈ 100%
    WATER.used += WATER.lpm/60*dt;
  }
  const pos = wGeo.attributes.position;
  const nx = S.true_.x*1000 + Math.sin(S.true_.th)*190;
  const nz = S.true_.z*1000 + Math.cos(S.true_.th)*190;
  let live = 0, anyLive = false;
  for(let i=0;i<WATER.N;i++){
    if(wLife[i] > 0){
      anyLive = true;
      wLife[i] -= dt;
      wVel[i*3+1] -= 9200*dt;
      pos.array[i*3  ] += wVel[i*3  ]*dt;
      pos.array[i*3+1] += wVel[i*3+1]*dt;
      pos.array[i*3+2] += wVel[i*3+2]*dt;
      if(pos.array[i*3+1] < 20) wLife[i] = 0;
    }else if(spraying && live < 26){
      live++; anyLive = true;
      pos.array[i*3]=nx; pos.array[i*3+1]=300; pos.array[i*3+2]=nz;
      const a  = S.true_.th + (Math.random()*2-1)*0.16;
      const sp = 4200 + Math.random()*900;
      wVel[i*3  ] = Math.sin(a)*sp;
      wVel[i*3+1] = 1500 + Math.random()*900;
      wVel[i*3+2] = Math.cos(a)*sp;
      wLife[i] = 1.1;
    }else{
      pos.array[i*3+1] = -9999;
    }
  }
  pos.needsUpdate = true;
  wPts.visible = anyLive;

  if(spraying){                                 // ดับไฟ: ใกล้พอ + เล็งเข้าเป้า
    for(const f of FIRES){
      if(f.int <= 0.02) continue;
      const dx=f.x-nx, dz=f.z-nz, d=Math.hypot(dx,dz);
      if(d > 2600) continue;
      let a = Math.atan2(dx,dz) - S.true_.th;
      while(a >  Math.PI) a -= 2*Math.PI;
      while(a < -Math.PI) a += 2*Math.PI;
      if(Math.abs(a) < 0.42) f.int = Math.max(0, f.int - dt*(0.55 - d/9000));
    }
  }
}

/* =========================================================================
   IMU — เลียนแบบ BMI270
   ========================================================================= */
const IMU = { ax:0, ay:0, az:9.81, gx:0, gy:0, gz:0, headingDeg:0, pitchDeg:0, rollDeg:0, _v:0, _w:0 };
function imuStep(dt){
  const aFwd = (S.v - IMU._v)/Math.max(dt,1e-4);
  const aYaw = (S.w - IMU._w)/Math.max(dt,1e-4);
  IMU._v = S.v; IMU._w = S.w;
  const pitch = THREE.MathUtils.degToRad(-S.tilt*0.35);
  const roll  = THREE.MathUtils.degToRad(S.tilt*0.55);
  IMU.ax = +(aFwd + Math.sin(pitch)*9.81 + noise(0.06)).toFixed(3);
  IMU.ay = +(S.v*S.w + Math.sin(roll)*9.81 + noise(0.06)).toFixed(3);
  IMU.az = +(9.81*Math.cos(pitch)*Math.cos(roll) + noise(0.09)).toFixed(3);
  IMU.gx = +noise(0.02).toFixed(4);
  IMU.gy = +(aYaw*0.02 + noise(0.02)).toFixed(4);
  IMU.gz = +(S.w + noise(0.015)).toFixed(4);
  let hd = S.true_.th*180/Math.PI % 360; if(hd>180) hd-=360; if(hd<-180) hd+=360;
  IMU.headingDeg = +hd.toFixed(1);
  IMU.pitchDeg   = +(pitch*180/Math.PI).toFixed(2);
  IMU.rollDeg    = +(roll*180/Math.PI).toFixed(2);
}

/* =========================================================================
   ระบบขับอัตโนมัติ — ตอบสนองจากเซนเซอร์ตรง ๆ (ไม่รู้ตำแหน่งไฟล่วงหน้า)
   เห็นเปลวไฟ → เลี้ยวเข้าหา เข้าใกล้ แล้วฉีด
   ไม่เห็น      → สำรวจ หลบกำแพงด้วย LiDAR (ได้แผนที่เป็นผลพลอยได้)
   ========================================================================= */
const AUTO = { v:0, w:0, spray:false, turn:0, turnT:0, mode:'idle' };
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));

function autopilot(dt){
  if(!CMD.auto || CMD.estop){ AUTO.v=0; AUTO.w=0; AUTO.spray=false; AUTO.mode='off'; return; }

  const front = Math.min(minRange(-24, 24), 12000);
  const left  = minRange(30, 95);
  const right = minRange(-95, -30);

  if(FIRE.out >= FIRES.length){                     // ดับหมดแล้ว
    AUTO.v=0; AUTO.w=0; AUTO.spray=false; AUTO.mode='done'; return;
  }

  if(FIRE.flame > 0.03 && FIRE.nearest > 0){        // เห็นเปลวไฟ
    const err = FIRE.nearestAng;                    // องศา, + = ซ้าย
    AUTO.w = clamp(err/40, -1, 1);
    const aimed = Math.abs(err) < 24;
    const close = FIRE.nearest < 1900;
    AUTO.spray = close && aimed;
    if(close)            { AUTO.v = 0;    AUTO.mode='spray'; }
    else if(front < 650) { AUTO.v = 0;    AUTO.w = left>right ? 1 : -1; AUTO.mode='avoid'; }
    else                 { AUTO.v = aimed ? 0.75 : 0.28;  AUTO.mode='approach'; }
    return;
  }

  // สำรวจ
  AUTO.spray = false;
  AUTO.mode = 'explore';
  AUTO.turnT -= dt;
  if(AUTO.turnT <= 0){                              // สุ่มเปลี่ยนทิศเป็นช่วง ๆ ให้เดินได้ทั่ว
    AUTO.turnT = 1.6 + Math.random()*2.4;
    AUTO.turn  = (Math.random()*2-1)*0.35;
  }
  if(front < 750){
    AUTO.v = 0;
    AUTO.w = left > right ? 1 : -1;
    AUTO.mode = 'avoid';
  }else if(front < 1600){
    AUTO.v = 0.3;
    AUTO.w = clamp((left-right)/4000, -1, 1);
  }else{
    AUTO.v = 0.8;
    AUTO.w = AUTO.turn;
  }
}

/* =========================================================================
   โมเดล: ตัวถัง + ล้อซ้าย/ขวา (แยกจาก STL แล้ว หมุนได้จริง)
   ========================================================================= */
const robot = new THREE.Group();
const inner = new THREE.Group();
inner.position.set(0, -GROUND_Y, -AXLE.z);
robot.add(inner);
scene.add(robot);

const matBody  = new THREE.MeshStandardMaterial({color:0xc2c8d0, metalness:.45, roughness:.5});
const matWheel = new THREE.MeshStandardMaterial({color:0x2b3138, metalness:.25, roughness:.75});
const wheelMesh = { L:null, R:null };

const FILES = [['model/body.stl','body'],['model/wheel_l.stl','L'],['model/wheel_r.stl','R']];
const progress = new Array(FILES.length).fill(0);
const bytes    = new Array(FILES.length).fill(1);
const loader   = new STLLoader();

Promise.all(FILES.map(([url],i) => new Promise((res,rej) =>
  loader.load(url, res, e => {
    if(!e.lengthComputable) return;
    progress[i]=e.loaded; bytes[i]=e.total; paintProgress();
  }, rej)
))).then(geoms => {
  geoms.forEach((g,i) => {
    const kind = FILES[i][1];
    const mesh = new THREE.Mesh(g, kind==='body' ? matBody : matWheel);
    mesh.castShadow = mesh.receiveShadow = true;
    if(kind==='body'){ inner.add(mesh); return; }
    mesh.position.set(kind==='L' ? AXLE.x : -AXLE.x, AXLE.y, AXLE.z);
    const mark = new THREE.Mesh(
      new THREE.BoxGeometry(3, WHEEL_R_MM*0.82, 9),
      new THREE.MeshStandardMaterial({ color:0xf85149, emissive:0x5c1512, roughness:.6 })
    );
    mark.position.set((kind==='L'?1:-1)*21.2, WHEEL_R_MM*0.41, 0);
    mark.castShadow = true;
    mesh.add(mark);
    wheelMesh[kind] = mesh;
    inner.add(mesh);
  });
  document.getElementById('loader').classList.add('done');
  mqttStart();
  start();
}).catch(() => {
  document.getElementById('lpct').textContent = 'โหลดโมเดลไม่สำเร็จ';
  document.getElementById('lerr').textContent =
    'อ่านไฟล์ใน model/ ไม่ได้ — ต้องเปิดผ่าน local server ไม่ใช่ file://';
});

function paintProgress(){
  const done = progress.reduce((a,b)=>a+b,0), tot = bytes.reduce((a,b)=>a+b,0);
  const p = tot ? done/tot : 0;
  document.querySelector('#lbar > i').style.width = (p*100)+'%';
  document.getElementById('lpct').textContent = `กำลังโหลดโมเดล… ${(p*100).toFixed(0)}%`;
}

/* =========================================================================
   สถานะ + ฟิสิกส์
   ========================================================================= */
const S = {
  cmdV:0, cmdW:0, cmdV_r:0, cmdW_r:0,
  v:0, w:0,
  true_:{x:0,z:0,th:0},
  odom :{x:0,z:0,th:0},
  dist:0,
  wh:{ L:{pos:0,rpm:0,cur:0.35,tmp:32,slip:0}, R:{pos:0,rpm:0,cur:0.35,tmp:32,slip:0} },
  tilt:0, wh_used:0, stalled:false, stallT:0, hitWall:false, seq:0,
};
const noise = (a)=> (Math.random()*2-1)*a;
const surfSlip = 0.12;                       // พื้นเปียกน้ำดับเพลิง

const ROBOT_R = 215;
function hitsWall(x,z){
  for(const o of obstacles){
    const b = o.userData.aabb;
    if(x > b.minX-ROBOT_R && x < b.maxX+ROBOT_R &&
       z > b.minZ-ROBOT_R && z < b.maxZ+ROBOT_R) return true;
  }
  return false;
}

function resetAll(){
  S.odom={x:0,z:0,th:0}; S.true_={x:0,z:0,th:0};
  S.dist=0; S.wh_used=0; S.wh.L.pos=S.wh.R.pos=0;
  S.cmdV_r=0; S.cmdW_r=0; S.v=0; S.w=0;
  GRID.data.fill(0); GRID.seen=0;
  LIDAR.rev=0; LIDAR.dist.fill(0); LIDAR.qual.fill(0);
  WATER.tank=100; WATER.used=0;
  FIRES.forEach(f=>{ f.int = f.int0; });
  trailTrue.clear(); trailOdom.clear();
}

function step(dt){
  autopilot(dt);
  const src = CMD.auto ? AUTO : CMD;
  const tv = CMD.estop ? 0 : src.v;
  const tw = CMD.estop ? 0 : src.w;

  S.cmdV = tv * MAX_V * CMD.throttle;
  S.cmdW = tw * MAX_W * CMD.throttle;

  const ramp = (cur,tgt,rate)=>{
    const d = tgt-cur, m = rate*dt;
    return Math.abs(d)<=m ? tgt : cur + Math.sign(d)*m;
  };
  const cmdV = ramp(S.cmdV_r, S.cmdV, ACC_V), cmdW = ramp(S.cmdW_r, S.cmdW, ACC_W);
  S.cmdV_r = cmdV; S.cmdW_r = cmdW;

  const vlCmd = cmdV - cmdW*L/2;
  const vrCmd = cmdV + cmdW*L/2;

  const agg = Math.min(1, Math.abs(cmdV-S.v)/0.4 + Math.abs(cmdW)/2.2);
  const slipOf = (vc)=>{
    if(Math.abs(vc)<1e-4) return 0;
    return Math.max(0, Math.min(0.95, surfSlip*(0.35+0.65*agg) + noise(surfSlip*0.35)));
  };
  S.wh.L.slip = slipOf(vlCmd);
  S.wh.R.slip = slipOf(vrCmd);

  const vlG = vlCmd*(1-S.wh.L.slip);
  const vrG = vrCmd*(1-S.wh.R.slip);

  S.v = (vlG+vrG)/2;
  S.w = (vrG-vlG)/L;
  S.true_.th += S.w*dt;
  const nx = S.true_.x + S.v*Math.sin(S.true_.th)*dt;
  const nz = S.true_.z + S.v*Math.cos(S.true_.th)*dt;
  // ชนกำแพง = เลื่อนต่อไม่ได้ แต่ล้อยังหมุน → encoder ยังนับ = odom เพี้ยน
  if(hitsWall(nx*1000, nz*1000)){ S.hitWall = true; S.v = 0; }
  else { S.hitWall = false; S.true_.x = nx; S.true_.z = nz; }

  const vOdom = (vlCmd+vrCmd)/2, wOdom = (vrCmd-vlCmd)/L;
  S.odom.th += wOdom*dt;
  S.odom.x  += vOdom*Math.sin(S.odom.th)*dt;
  S.odom.z  += vOdom*Math.cos(S.odom.th)*dt;
  S.dist    += Math.abs(vOdom)*dt;

  for(const [id,vc] of [['L',vlCmd],['R',vrCmd]]){
    const wh = S.wh[id];
    const omega = vc / R;
    wh.pos += omega*dt;                        // สะสมต่อเนื่อง — ห้าม wrap
    wh.rpm  = omega*60/(2*Math.PI);
    const alpha = (omega - (wh.omegaPrev ?? omega)) / dt;
    wh.omegaPrev = omega;
    const target = 0.35 + 0.09*Math.abs(alpha) + 0.85*Math.abs(vc) + 6.5*wh.slip + noise(0.05);
    wh.cur += (Math.min(14, Math.max(0.2,target)) - wh.cur) * Math.min(1, dt*6);
    wh.tmp += (wh.cur*wh.cur*0.055 - (wh.tmp-32)*0.035) * dt;
  }

  const wantMove = Math.abs(S.cmdV)>0.05 || Math.abs(S.cmdW)>0.15;
  const moving   = Math.abs(S.v)>0.02 || Math.abs(S.w)>0.06;
  S.stallT = (wantMove && !moving) ? S.stallT+dt : 0;
  S.stalled = S.stallT > 0.5;

  const rough = 0.35;
  const tiltT = Math.abs(S.w)*2.4 + Math.abs(S.v)*rough*7 + noise(rough*1.6);
  S.tilt += (tiltT - S.tilt) * Math.min(1, dt*5);

  S.wh_used += V_BATT*(S.wh.L.cur+S.wh.R.cur)*dt/3600;

  robot.position.set(S.true_.x*1000, 0, S.true_.z*1000);
  robot.rotation.y = S.true_.th;
  if(wheelMesh.L) wheelMesh.L.rotation.x = S.wh.L.pos;
  if(wheelMesh.R) wheelMesh.R.rotation.x = S.wh.R.pos;
  inner.rotation.z = THREE.MathUtils.degToRad(-S.tilt*0.35);
  inner.rotation.x = THREE.MathUtils.degToRad(
    Math.min(3, Math.abs(S.cmdV-S.v)*4)*Math.sign(S.cmdV-S.v));
}

/* =========================================================================
   ส่งค่าออก
   ========================================================================= */
const norm180 = (d)=>{ while(d>180)d-=360; while(d<-180)d+=360; return d; };
const r2 = (n,d=2)=> +n.toFixed(d);

function batteryPct(){ return Math.max(0, 100 - S.wh_used/BATT_WH*100); }

function pubTelemetry(){
  if(!client || !client.connected) return;
  S.seq++;
  const thDeg = r2(norm180(S.odom.th*180/Math.PI),1);
  const drive = {
    ts: Date.now(), seq: S.seq,
    wheels: ['L','R'].map(id => ({
      id, posRad:r2(S.wh[id].pos,3), rpm:r2(S.wh[id].rpm,1),
      currentA:r2(S.wh[id].cur), tempC:r2(S.wh[id].tmp,1),
    })),
    odom: { x:r2(S.odom.x), y:r2(S.odom.z), thetaDeg:thDeg, distM:r2(S.dist,1) },
    vel : { linear:r2(S.v,3), angular:r2(S.w,3) },
    health: { slip:r2((S.wh.L.slip+S.wh.R.slip)/2), stalled:S.stalled,
              tiltDeg:r2(S.tilt,1), hitWall:S.hitWall },
  };
  client.publish(T_DRIVE, JSON.stringify(drive));

  client.publish(T_TELEM, JSON.stringify({
    deviceId:'firebot-r1', ts:drive.ts, seq:S.seq,
    rpmL:drive.wheels[0].rpm, rpmR:drive.wheels[1].rpm,
    radL:drive.wheels[0].posRad, radR:drive.wheels[1].posRad,
    x:drive.odom.x, y:drive.odom.y, thetaDeg:thDeg,
    thetaRad:r2(thDeg*Math.PI/180,4),
    channels:{
      'wheel.rpmL':drive.wheels[0].rpm, 'wheel.rpmR':drive.wheels[1].rpm,
      'wheel.radL':drive.wheels[0].posRad, 'wheel.radR':drive.wheels[1].posRad,
      'wheel.currentL':drive.wheels[0].currentA, 'wheel.currentR':drive.wheels[1].currentA,
      'wheel.tempL':drive.wheels[0].tempC, 'wheel.tempR':drive.wheels[1].tempC,
      'odom.x':drive.odom.x, 'odom.y':drive.odom.y, 'odom.thetaDeg':thDeg,
      'odom.distM':drive.odom.distM,
      'vel.linear':drive.vel.linear, 'vel.angular':drive.vel.angular,
      'imu.headingDeg':IMU.headingDeg, 'imu.pitchDeg':IMU.pitchDeg, 'imu.rollDeg':IMU.rollDeg,
      'imu.accelX':IMU.ax, 'imu.accelY':IMU.ay, 'imu.accelZ':IMU.az, 'imu.gyroZ':IMU.gz,
      'fire.flame':r2(FIRE.flame,3), 'fire.tempC':r2(FIRE.tempC,1),
      'fire.smokePpm':Math.round(FIRE.smokePpm),
      'fire.nearestM':r2(FIRE.nearest/1000), 'fire.nearestAngDeg':r2(FIRE.nearestAng,1),
      'fire.remaining':FIRES.length-FIRE.out, 'fire.total':FIRES.length,
      'water.tankPct':r2(WATER.tank,1), 'water.usedL':r2(WATER.used,2),
      'water.spraying':WATER.on ? 1 : 0,
      'power.batteryPct':r2(batteryPct(),1),
      'lidar.nearestMm':Math.round(LIDAR.stat.min), 'lidar.validPts':LIDAR.valid,
      'lidar.rev':LIDAR.rev,
      'map.cellsSeen':GRID.seen,
      'health.slip':drive.health.slip, 'health.stalled':S.stalled?1:0,
      'health.hitWall':S.hitWall?1:0,
      'auto.on':CMD.auto?1:0, 'auto.mode':AUTO.mode,
    },
  }));
  pubN++;
}

function pubScan(){
  if(!client || !client.connected) return;
  const ranges = new Array(360), inten = new Array(360);
  for(let k=0;k<360;k++){
    // JSON ไม่มี Infinity → null แทน inf ของ ROS
    ranges[k] = LIDAR.dist[k] > 0 ? r2(LIDAR.dist[k]/1000,3) : null;
    inten[k]  = LIDAR.qual[k];
  }
  client.publish(T_SCAN, JSON.stringify({
    ts:Date.now(), rev:LIDAR.rev, frame_id:'laser',
    angle_min:0, angle_max:r2(2*Math.PI-Math.PI/180,5),
    angle_increment:r2(Math.PI/180,7),
    scan_time:r2(60/LIDAR.rpm,4), time_increment:r2(60/LIDAR.rpm/360,7),
    range_min:LIDAR.rMin/1000, range_max:LIDAR.rMax/1000,
    ranges, intensities:inten,
  }));
}

function pubMap(){
  if(!client || !client.connected) return;
  client.publish(T_MAP, JSON.stringify({
    ts:Date.now(),
    w:GRID.w, h:GRID.h, res:GRID.res, originX:GRID.ox, originZ:GRID.oz,
    cellsSeen:GRID.seen,
    robot:{ x:r2(S.true_.x*1000,0), z:r2(S.true_.z*1000,0), thetaDeg:r2(S.true_.th*180/Math.PI,1) },
    fires:FIRES.filter(f=>f.int>0.02).map(f=>({x:f.x, z:f.z, int:r2(f.int,2)})),
    legend:'0=unknown 1=free 2=occupied',
    data:gridB64(),
  }));
}

/* =========================================================================
   สถานะบนจอ
   ========================================================================= */
const chipEl = document.getElementById('chip');
function paintChip(text, cls){
  chipEl.textContent = text;
  chipEl.className = 'mono' + (cls ? ' '+cls : '');
}
function updateChip(){
  const up = client && client.connected;
  const cmdFresh = Date.now()-lastCmdTs < 4000;
  paintChip(
    (up ? '● broker เชื่อมต่อแล้ว' : '○ ไม่ได้เชื่อม broker') + '\n' +
    'ส่งออก ' + pubN + ' · รับคำสั่ง ' + cmdN + (cmdFresh ? ' (สด)' : '') + '\n' +
    'ควบคุม: ' + (CMD.estop ? 'E-STOP' : CMD.auto ? 'AUTO · '+AUTO.mode : 'manual') + '\n' +
    'ไฟดับแล้ว ' + FIRE.out + '/' + FIRES.length + ' · แผนที่ ' + GRID.seen + ' ช่อง',
    up ? (cmdFresh ? 'ok' : '') : 'bad'
  );
}

/* =========================================================================
   loop — เดินต่อแม้แท็บถูกซ่อน (เพราะตัวควบคุมอยู่อีกหน้าต่าง)
   ========================================================================= */
function resize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
}
addEventListener('resize', resize);

function start(){
  resize();
  let prev = performance.now(), acc = 0;
  let lastTrail=0, lastMap=0, lastMapPub=0, lastTelem=0, lastChip=0;
  const DT = 1/100;

  function frame(draw){
    const now = performance.now();
    let dt = (now-prev)/1000; prev = now;
    dt = Math.min(dt, 0.25);
    acc += dt;
    let guard = 0;
    while(acc >= DT && guard++ < 60){ step(DT); acc -= DT; }
    if(guard >= 60) acc = 0;

    lidarStep(dt); fireStep(dt); waterStep(dt); imuStep(dt);

    if(now-lastTelem  > 1000/HZ_TELEM){ lastTelem  = now; pubTelemetry(); }
    if(now-lastMapPub > 1000/HZ_MAP)  { lastMapPub = now; pubMap(); }
    if(now-lastChip   > 500)          { lastChip   = now; updateChip(); }

    if(draw){
      if(now-lastTrail > 50){
        lastTrail = now;
        trailTrue.push(S.true_.x*1000, S.true_.z*1000);
        trailOdom.push(S.odom.x*1000, S.odom.z*1000);
      }
      if(now-lastMap > 250){ lastMap = now; drawMap(); }
      controls.update();
      renderer.render(scene,camera);
    }
  }

  renderer.setAnimationLoop(()=>{ if(!document.hidden) frame(true); });
  // requestAnimationFrame หยุดสนิทเมื่อแท็บถูกซ่อน — timer ยังเดิน (ช้าลง)
  // จึงยังส่งค่าและขับอัตโนมัติต่อได้แม้ผู้ใช้ไปดูหน้า Pancabo
  setInterval(()=>{ if(document.hidden) frame(false); }, 200);
}
</script>
